<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff & Roles · RestrOS</title>
<script>try{var t=JSON.parse(localStorage.getItem('restros:theme'));if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍🍳</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="app" id="app">
  <div class="app-col">
    <main class="app-main" id="main">
      <div class="page-head">
        <div>
          <h2>Staff &amp; Roles</h2>
          <p id="staffSub">—</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary btn-sm" id="btnRole">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-shield"></use></svg>New role
          </button>
          <button class="btn btn-primary btn-sm" id="btnInvite">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-plus"></use></svg>Invite teammate
          </button>
        </div>
      </div>

      <div class="tabs mb-5" id="staffTabs" role="tablist">
        <button class="tab" role="tab" data-t="people" aria-selected="true">People</button>
        <button class="tab" role="tab" data-t="roles" aria-selected="false">Roles &amp; permissions</button>
        <button class="tab" role="tab" data-t="audit" aria-selected="false">Audit log</button>
      </div>

      <div id="staffPanel"></div>
    </main>
  </div>
</div>

<script type="module" src="../assets/js/staff.js"></script>
</body>
</html>
