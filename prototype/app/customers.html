<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers · RestrOS</title>
<script>try{var t=JSON.parse(localStorage.getItem('restros:theme'));if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💚</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="app" id="app">
  <div class="app-col">
    <main class="app-main" id="main">
      <div class="page-head">
        <div>
          <h2>Customers</h2>
          <p id="crmSub">Adda Points loyalty · —</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary btn-sm"><svg class="icon"><use href="../assets/icons/sprite.svg#i-download"></use></svg>Export</button>
          <button class="btn btn-primary btn-sm" id="btnCampaign">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-send"></use></svg>New campaign
          </button>
        </div>
      </div>

      <div class="bento mb-5" id="crmStats"></div>

      <div class="bento">
        <section class="col-8 card">
          <div class="toolbar" style="padding:var(--space-3) var(--space-4);margin:0;border-bottom:1px solid var(--border-subtle)">
            <h3 class="t-base">Guests</h3>
            <select class="select" id="segFilter" style="max-width:200px"></select>
            <span class="grow"></span>
            <div class="input-group" style="max-width:220px">
              <svg class="icon"><use href="../assets/icons/sprite.svg#i-search"></use></svg>
              <input class="input" id="crmSearch" type="search" placeholder="Name or phone…">
            </div>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th>Guest</th><th>Tier</th><th class="col-num">Visits</th><th class="col-num">Lifetime</th>
                <th class="col-num">Avg bill</th><th class="col-num">Points</th><th>Last seen</th><th>Favourite</th>
              </tr></thead>
              <tbody id="crmRows"></tbody>
            </table>
          </div>
        </section>

        <section class="col-4 stack gap-4">
          <div class="card">
            <div class="card-header"><h3>Segments</h3></div>
            <div id="segList"></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Campaigns</h3></div>
            <div id="cmpList"></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Recent feedback</h3></div>
            <div id="fbList"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script type="module" src="../assets/js/customers.js"></script>
</body>
</html>
