<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · RestrOS</title>
<script>try{var t=JSON.parse(localStorage.getItem('restros:theme'));if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="app" id="app">
  <div class="app-col">
    <main class="app-main" id="main">
      <div class="page-head">
        <div>
          <h2>Reports</h2>
          <p>29 Jul – 27 Aug 2026 · Shyambazar · all channels</p>
        </div>
        <div class="page-actions">
          <div class="btn-group" role="group" id="reportRange">
            <button class="btn" data-r="7">7d</button>
            <button class="btn" data-r="14">14d</button>
            <button class="btn" aria-pressed="true" data-r="30">30d</button>
          </div>
          <button class="btn btn-secondary btn-sm" id="btnGst">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-download"></use></svg>GSTR-1 export
          </button>
          <button class="btn btn-secondary btn-sm"><svg class="icon"><use href="../assets/icons/sprite.svg#i-printer"></use></svg>Print</button>
        </div>
      </div>

      <div id="reports" class="stack gap-4"></div>
    </main>
  </div>
</div>

<script type="module" src="../assets/js/reports.js"></script>
</body>
</html>
