<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu · RestrOS</title>
<script>try{var t=JSON.parse(localStorage.getItem('restros:theme'));if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="app" id="app">
  <div class="app-col">
    <main class="app-main" id="main">
      <div class="page-head">
        <div>
          <h2>Menu</h2>
          <p>Transcribed from the printed card · <span id="menuMeta">—</span></p>
        </div>
        <div class="page-actions">
          <a class="btn btn-secondary btn-sm" href="../guest/menu.html" target="_blank" rel="noopener">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-qr"></use></svg>Preview guest menu
          </a>
          <button class="btn btn-secondary btn-sm"><svg class="icon"><use href="../assets/icons/sprite.svg#i-upload"></use></svg>Import</button>
          <button class="btn btn-primary btn-sm" id="btnPublish">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-check"></use></svg>Publish v15
          </button>
        </div>
      </div>

      <div id="menuAlerts" class="stack gap-3 mb-5"></div>

      <div class="bento mb-5" id="menuStats"></div>

      <div class="card">
        <div class="toolbar" style="padding:var(--space-3) var(--space-4);margin:0;border-bottom:1px solid var(--border-subtle)">
          <div class="input-group" style="max-width:280px">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-search"></use></svg>
            <input class="input" id="menuSearch" type="search" placeholder="Search items…">
          </div>
          <div class="segmented" role="group" aria-label="Filter" id="menuFilter">
            <button data-f="all" aria-selected="true">All</button>
            <button data-f="pending">Needs price</button>
            <button data-f="unavailable">86’d</button>
            <button data-f="draft">Drafts</button>
          </div>
          <div class="segmented" role="group" aria-label="Diet" id="menuDiet">
            <button data-d="all" aria-selected="true">Any</button>
            <button data-d="veg">Veg</button>
            <button data-d="nonveg">Non-veg</button>
          </div>
          <span class="grow"></span>
          <span class="t-xs dim" id="menuCount"></span>
        </div>
        <div id="menuList"></div>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="itemScrim"></div>
<aside class="drawer" id="itemDrawer" role="dialog" aria-modal="true" aria-labelledby="itTitle">
  <div class="drawer-header">
    <h3 id="itTitle">Edit item</h3>
    <button class="btn btn-ghost btn-icon btn-sm ml-auto" data-close-item aria-label="Close">
      <svg class="icon"><use href="../assets/icons/sprite.svg#i-x"></use></svg>
    </button>
  </div>
  <div class="drawer-body" id="itBody"></div>
  <div class="drawer-footer">
    <button class="btn btn-danger" id="itDelete">Delete</button>
    <button class="btn btn-secondary" data-close-item>Cancel</button>
    <button class="btn btn-primary grow" id="itSave">Save changes</button>
  </div>
</aside>

<script type="module" src="../assets/js/menu.js"></script>
</body>
</html>
