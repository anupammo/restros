<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders · RestrOS</title>
<script>try{var t=JSON.parse(localStorage.getItem('restros:theme'));if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="app" id="app">
  <div class="app-col">
    <main class="app-main" id="main">
      <div class="page-head">
        <div>
          <h2>Orders</h2>
          <p id="ordersSub">Business date 27 Aug 2026 · till open since 11:00</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary btn-sm"><svg class="icon"><use href="../assets/icons/sprite.svg#i-download"></use></svg>Export CSV</button>
          <button class="btn btn-secondary btn-sm"><svg class="icon"><use href="../assets/icons/sprite.svg#i-printer"></use></svg>Day-end report</button>
          <a class="btn btn-primary btn-sm" href="pos.html"><svg class="icon"><use href="../assets/icons/sprite.svg#i-plus"></use></svg>New order</a>
        </div>
      </div>

      <div class="bento mb-6" id="orderStats"></div>

      <div class="card">
        <div class="tabs" id="orderTabs" role="tablist"></div>
        <div class="toolbar" style="padding:var(--space-3) var(--space-4);margin:0">
          <div class="input-group" style="max-width:280px">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-search"></use></svg>
            <input class="input" id="orderSearch" type="search" placeholder="Order, KOT, guest, phone…">
          </div>
          <select class="select" id="channelFilter" style="max-width:180px">
            <option value="all">All channels</option>
            <option value="dine_in">Dine-in</option>
            <option value="takeaway">Takeaway</option>
            <option value="qr">QR self-order</option>
            <option value="swiggy">Swiggy</option>
            <option value="zomato">Zomato</option>
          </select>
          <select class="select" id="payFilter" style="max-width:160px">
            <option value="all">All payments</option>
            <option value="upi">UPI</option>
            <option value="cash">Cash</option>
            <option value="card">Card</option>
            <option value="aggregator">Aggregator</option>
          </select>
          <span class="grow"></span>
          <span class="t-xs dim" id="orderCount"></span>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Order</th><th>Channel</th><th>Table / guest</th><th>Items</th>
              <th>Placed</th><th>Prep</th><th>Payment</th><th>Status</th><th class="col-num">Total</th><th></th>
            </tr></thead>
            <tbody id="orderRows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="orderScrim"></div>
<aside class="drawer" id="orderDrawer" role="dialog" aria-modal="true" aria-labelledby="odTitle">
  <div class="drawer-header">
    <h3 id="odTitle">Order</h3>
    <button class="btn btn-ghost btn-icon btn-sm ml-auto" data-close-order aria-label="Close">
      <svg class="icon"><use href="../assets/icons/sprite.svg#i-x"></use></svg>
    </button>
  </div>
  <div class="drawer-body" id="odBody"></div>
  <div class="drawer-footer">
    <button class="btn btn-secondary" id="odPrint"><svg class="icon"><use href="../assets/icons/sprite.svg#i-printer"></use></svg>Reprint bill</button>
    <button class="btn btn-secondary" id="odRefund">Refund</button>
    <button class="btn btn-primary grow" data-close-order>Done</button>
  </div>
</aside>

<script type="module" src="../assets/js/orders.js"></script>
</body>
</html>
