<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tables · RestrOS</title>
<script>try{var t=JSON.parse(localStorage.getItem('restros:theme'));if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="app" id="app">
  <div class="app-col">
    <main class="app-main" id="main">
      <div class="page-head">
        <div>
          <h2>Tables</h2>
          <p>Shyambazar · 21 tables · <span id="floorSub">—</span></p>
        </div>
        <div class="page-actions">
          <div class="segmented" id="zoneTabs" role="tablist"></div>
          <button class="btn btn-secondary btn-sm" id="btnEditFloor">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-edit"></use></svg>Edit layout
          </button>
          <button class="btn btn-primary btn-sm" id="btnReserve">
            <svg class="icon"><use href="../assets/icons/sprite.svg#i-calendar"></use></svg>New reservation
          </button>
        </div>
      </div>

      <div class="bento" id="floorStats"></div>

      <div class="bento mt-4">
        <section class="col-8 card">
          <div class="card-header">
            <h3 id="zoneName">Ground Floor</h3>
            <div class="ml-auto legend">
              <span class="legend-item"><span class="legend-swatch" style="background:var(--brand)"></span>Occupied</span>
              <span class="legend-item"><span class="legend-swatch" style="background:var(--info)"></span>Billed</span>
              <span class="legend-item"><span class="legend-swatch" style="background:var(--warning)"></span>Reserved</span>
              <span class="legend-item"><span class="legend-swatch" style="background:var(--border-strong)"></span>Needs clearing</span>
            </div>
          </div>
          <div class="card-body">
            <div class="floorplan" id="floorplan"></div>
          </div>
        </section>

        <section class="col-4 stack gap-4">
          <div class="card">
            <div class="card-header"><h3>Tonight's book</h3>
              <span class="ml-auto badge badge-brand" id="resCount">—</span>
            </div>
            <div id="resList"></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Server load</h3></div>
            <div class="card-body stack gap-4" id="serverLoad"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="tblScrim"></div>
<aside class="drawer" id="tblDrawer" role="dialog" aria-modal="true" aria-labelledby="tblTitle">
  <div class="drawer-header">
    <h3 id="tblTitle">Table</h3>
    <button class="btn btn-ghost btn-icon btn-sm ml-auto" data-close-tbl aria-label="Close">
      <svg class="icon"><use href="../assets/icons/sprite.svg#i-x"></use></svg>
    </button>
  </div>
  <div class="drawer-body" id="tblBody"></div>
  <div class="drawer-footer" id="tblFoot"></div>
</aside>

<script type="module" src="../assets/js/tables.js"></script>
</body>
</html>
